[project]
name = "gambito-train"
version = "0.1.0"
description = "Training pipeline for gambito's evaluator network"
requires-python = ">=3.12"
dependencies = [
    "chess>=1.10",
    "numpy>=2",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gambito_train"]
